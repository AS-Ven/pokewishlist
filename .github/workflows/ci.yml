name: CI

on:
  push:
  pull_request:

jobs:
  add-to-wishlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test addToWishList
        run: npm test -- --run -t addToWishList

      - name: Check lint rules
        run: npm run lint

      - name: Check code formatting
        run: npm run format:check
