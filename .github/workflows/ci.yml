name: CI

on:
  push:
  pull_request:

jobs:
  front:
    name: Front - Nuxt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test:front

      - name: Check translation keys
        run: npm run test:i18n

      - name: Check frontend TypeScript types
        run: npm run typecheck:front

      - name: Check frontend lint rules
        run: npm run lint:front

      - name: Check frontend formatting
        run: npm run format:front

      - name: Build Nuxt application
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

  back:
    name: Back - Hono
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm run test:back

      - name: Check translation keys
        run: npm run test:i18n

      - name: Check backend TypeScript types
        run: npm run typecheck:back

      - name: Check backend lint rules
        run: npm run lint:back

      - name: Check backend formatting
        run: npm run format:back

      - name: Run Neon database integration test
        run: npm run test:db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  coverage:
    name: Vitest Coverage
    needs: [front, back]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest coverage
        run: npm run test:coverage
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Upload Vitest coverage report
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: coverage/
          if-no-files-found: error

