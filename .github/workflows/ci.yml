name: CI

on:
  push:
  pull_request:

jobs:
  add-to-wishlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test addToWishList
        run: npm test -- --run -t addToWishList
